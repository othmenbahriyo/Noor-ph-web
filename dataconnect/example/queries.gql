mutation CreateUser($email: String!, $displayName: String!, $address: String!, $neighborhoodId: UUID!) @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", email: $email, displayName: $displayName, address: $address, neighborhoodId: $neighborhoodId})
}

mutation UpdateUser($displayName: String, $phoneNumber: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: $displayName, phoneNumber: $phoneNumber})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email
    displayName
    address
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing public user profiles") {
  users {
    id
    displayName
    profilePictureUrl
  }
}

mutation CreateNeighborhood($name: String!, $zipCode: String!) @auth(level: USER) {
  neighborhood_insert(data: {name: $name, zipCode: $zipCode})
}

mutation UpdateNeighborhood($id: UUID!, $description: String) @auth(level: USER) {
  neighborhood_update(key: {id: $id}, data: {description: $description})
}

mutation DeleteNeighborhood($id: UUID!) @auth(level: USER) {
  neighborhood_delete(key: {id: $id})
}

query GetNeighborhood($id: UUID!) @auth(level: PUBLIC, insecureReason: "Publicly accessible neighborhood data") {
  neighborhood(id: $id) {
    name
    zipCode
    description
  }
}

query ListNeighborhoods @auth(level: PUBLIC, insecureReason: "Public list of neighborhoods") {
  neighborhoods {
    name
    zipCode
  }
}

mutation CreatePost($neighborhoodId: UUID!, $content: String!, $type: String!) @auth(level: USER) {
  post_insert(data: {authorId_expr: "auth.uid", neighborhoodId: $neighborhoodId, content: $content, type: $type})
}

mutation UpdatePost($id: UUID!, $content: String) @auth(level: USER) {
  post_update(key: {id: $id}, data: {content: $content})
}

mutation DeletePost($id: UUID!) @auth(level: USER) {
  post_delete(key: {id: $id})
}

query GetPost($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public posts") {
  post(id: $id) {
    content
    type
    author { displayName }
  }
}

query ListPosts($neighborhoodId: UUID!) @auth(level: PUBLIC, insecureReason: "Public feed") {
  posts(where: {neighborhoodId: {eq: $neighborhoodId}}) {
    content
    createdAt
  }
}

mutation CreateComment($postId: UUID!, $text: String!) @auth(level: USER) {
  comment_insert(data: {authorId_expr: "auth.uid", postId: $postId, text: $text})
}

mutation UpdateComment($id: UUID!, $text: String!) @auth(level: USER) {
  comment_update(key: {id: $id}, data: {text: $text})
}

mutation DeleteComment($id: UUID!) @auth(level: USER) {
  comment_delete(key: {id: $id})
}

query ListComments($postId: UUID!) @auth(level: PUBLIC, insecureReason: "Public comments") {
  comments(where: {postId: {eq: $postId}}) {
    text
    author { displayName }
  }
}

mutation CreateEvent($title: String!, $dateTime: Timestamp!, $location: String!, $neighborhoodId: UUID!) @auth(level: USER) {
  event_insert(data: {organizerId_expr: "auth.uid", title: $title, dateTime: $dateTime, location: $location, neighborhoodId: $neighborhoodId})
}

mutation UpdateEvent($id: UUID!, $maxAttendees: Int) @auth(level: USER) {
  event_update(key: {id: $id}, data: {maxAttendees: $maxAttendees})
}

mutation DeleteEvent($id: UUID!) @auth(level: USER) {
  event_delete(key: {id: $id})
}

query ListEvents($neighborhoodId: UUID!) @auth(level: PUBLIC, insecureReason: "Public events") {
  events(where: {neighborhoodId: {eq: $neighborhoodId}}) {
    title
    dateTime
    location
  }
}

mutation CreateGroup($name: String!, $neighborhoodId: UUID!) @auth(level: USER) {
  group_insert(data: {name: $name, neighborhoodId: $neighborhoodId})
}

mutation UpdateGroup($id: UUID!, $description: String) @auth(level: USER) {
  group_update(key: {id: $id}, data: {description: $description})
}

mutation DeleteGroup($id: UUID!) @auth(level: USER) {
  group_delete(key: {id: $id})
}

query ListGroups($neighborhoodId: UUID!) @auth(level: PUBLIC, insecureReason: "Public groups") {
  groups(where: {neighborhoodId: {eq: $neighborhoodId}}) {
    name
    description
  }
}

mutation RSVPEvent($eventId: UUID!) @auth(level: USER) {
  eventRSVP_insert(data: {userId_expr: "auth.uid", eventId: $eventId})
}

mutation CancelRSVP($eventId: UUID!) @auth(level: USER) {
  eventRSVP_delete(key: {userId_expr: "auth.uid", eventId: $eventId})
}

mutation JoinGroup($groupId: UUID!) @auth(level: USER) {
  groupMember_insert(data: {userId_expr: "auth.uid", groupId: $groupId})
}

mutation LeaveGroup($groupId: UUID!) @auth(level: USER) {
  groupMember_delete(key: {userId_expr: "auth.uid", groupId: $groupId})
}